name: FE Dev CD

# develop 브랜치 → Dev ECS 클러스터(moyeota-v2-dev) 자동 배포
#   - FE CI가 develop push에서 만든 dev-<sha> 이미지를 빌드 산출물 그대로(digest) 반영한다.
#   - frontend(Next.js) 서비스에 반영한다.
#   - 배포 방식은 Dev 서비스 설정(Rolling, min 0% / max 100% + Circuit Breaker 자동 롤백)을 따른다.

on:
  workflow_run:
    workflows:
      - FE CI
    types:
      - completed
    branches:
      - develop

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: frontend-cd-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend (dev)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: https://dev.moyeota.com
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'moyeota-v2-dev' }}
      ECS_SERVICE: frontend

    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve immutable image
        id: release
        run: |
          set -Eeuo pipefail

          manifest="release-manifest/release-manifest.json"
          image_tag="$(jq -r '.image_tag' "$manifest")"
          image_digest="$(jq -r '.image_digest' "$manifest")"

          [[ "$image_tag" == dev-* ]]
          [[ "$image_digest" == sha256:* ]]

          {
            echo "image_ref=${ECR_REGISTRY}/${ECR_REPOSITORY}@${image_digest}"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ECS_DEPLOY_ROLE_ARN }}
          role-session-name: frontend-dev-cd-${{ github.run_id }}

      - name: Deploy to ECS
        uses: 100-hours-a-week/KTB4-3rd-CLOUD/.github/actions/ecs-deploy@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          image: ${{ steps.release.outputs.image_ref }}
          release-id: ${{ steps.release.outputs.image_tag }}
          timeout-seconds: '1200'
