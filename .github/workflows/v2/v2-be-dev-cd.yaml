name: BE Dev CD

# dev 브랜치 → Dev ECS 클러스터(moyeota-v2-dev) 자동 배포
#   - BE CI가 dev push에서 만든 dev-<sha> 이미지를 빌드 산출물 그대로(digest) 반영한다.
#   - 같은 BE 이미지를 rest·websocket 두 서비스에 반영한다.
#   - 배포 방식은 Dev 서비스 설정(Rolling, min 0% / max 100% + Circuit Breaker 자동 롤백)을 따른다.

on:
  workflow_run:
    workflows:
      - BE CI
    types:
      - completed
    branches:
      - dev

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: backend-cd-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }} (dev)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: https://dev.moyeota.com
    strategy:
      fail-fast: false
      matrix:
        service:
          - rest
          - websocket
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'moyeota-v2-dev' }}

    steps:
      - name: Checkout deploy action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve immutable image
        id: release
        run: |
          set -Eeuo pipefail

          manifest="release-manifest/release-manifest.json"
          image_tag="$(jq -r '.image_tag' "$manifest")"
          image_digest="$(jq -r '.image_digest' "$manifest")"

          [[ "$image_tag" == dev-* ]]
          [[ "$image_digest" == sha256:* ]]

          {
            echo "image_ref=${ECR_REGISTRY}/${ECR_REPOSITORY}@${image_digest}"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ECS_DEPLOY_ROLE_ARN }}
          role-session-name: backend-dev-cd-${{ matrix.service }}-${{ github.run_id }}

      - name: Deploy to ECS
        uses: ./.github/actions/ecs-deploy
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ matrix.service }}
          image: ${{ steps.release.outputs.image_ref }}
          release-id: ${{ steps.release.outputs.image_tag }}
          timeout-seconds: '1200'
