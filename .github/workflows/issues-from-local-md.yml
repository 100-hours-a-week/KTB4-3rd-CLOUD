name: Create issues from issue docs

on:
  push:
    branches: [main] # 레포의 기본 브랜치명에 맞게 변경
    paths:
      - 'issues/*.md'
      - 'issues/**/*.md'

permissions:
  contents: read
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 변경분 중 새로 추가된 issues/*.md만 골라내는 단계
      - id: changed
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          files="$(git diff --no-renames --diff-filter=A --name-only "$BEFORE" "$AFTER" \
            | grep -E '^issues/.+\.md$' || true)"
          {
            echo 'files<<EOF'
            printf '%s\n' "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # 파일의 첫 번째 H1을 제목으로, 문서 전체를 본문으로 사용
      - uses: actions/github-script@v9
        env:
          FILES: ${{ steps.changed.outputs.files }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const paths = process.env.FILES.split("\n").filter(Boolean);
            if (!paths.length) return;

            const allIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "all", per_page: 100 }
            );

            for (const path of paths) {
              const marker = `<!-- source-file: ${path} -->`;
              if (allIssues.some(i => !i.pull_request && i.body?.includes(marker))) {
                continue;
              }

              const body = fs.readFileSync(path, "utf8");
              const title = body.match(/^#\s+(.+)$/m)?.[1]
                ?? path.split("/").at(-1).replace(/\.md$/, "");

              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: `${body}\n\n${marker}`
              });
              allIssues.push(created.data);
            }