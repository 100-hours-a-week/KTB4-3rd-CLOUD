# 차트 버전은 install-platform.sh에 고정한다. Namespace는 platform-base가 만든다.
installCRDs: true

serviceAccount:
  create: true
  # Pod Identity 연결(v3/eks/pod_identity.tf)과 같은 이름이어야 한다.
  name: external-secrets

# Role 하나가 prod·stg 경로를 모두 읽으므로, Namespace를 넘는 Store와 쓰기 기능을 끈다.
processClusterStore: false
processClusterExternalSecret: false
processPushSecret: false
processClusterPushSecret: false

nodeSelector:
  role: system
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 256Mi

webhook:
  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 128Mi

certController:
  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 128Mi
