{{- range .Values.stages }}
---
# auth를 지정하지 않으면 컨트롤러의 Pod Identity 자격 증명을 쓴다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $.Values.storeName }}
  namespace: {{ . }}
  labels:
    stage: {{ . }}
    app.kubernetes.io/part-of: moyeota-v3
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ $.Values.region }}
{{- end }}
