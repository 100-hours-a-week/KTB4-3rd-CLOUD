stage: dev

# dev 파드는 non-prod 공용 노드(stage=stg)에 올리고 2개 AZ에 분산한다.
nodeStage: stg
zoneSpread: true

# dev EKS 이미지는 CI가 dev-<sha> digest로 갱신한다.
image:
  digest: sha256:71e36e43d4805be5e9fe14514e077faec2bfe0931f9bd080ba4423961a8fc04e

hpa:
  minReplicas: 1
  maxReplicas: 2

env:
  STAGE: dev

secrets:
  AI_DB_URL: ai/AI_DB_URL
  AI_QDRANT_API_KEY: ai/AI_QDRANT_API_KEY
  AI_QDRANT_URL: ai/AI_QDRANT_URL
  KAFKA_BOOTSTRAP_SERVERS: broker/KAFKA_BOOTSTRAP_SERVERS
