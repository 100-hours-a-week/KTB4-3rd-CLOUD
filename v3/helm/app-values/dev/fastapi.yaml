stage: dev

# dev 파드는 non-prod 공용 노드(stage=stg)에 올리고 2개 AZ에 분산한다.
nodeStage: stg
zoneSpread: true

# dev EKS 이미지는 CI가 dev-<sha> digest로 갱신한다.
image:
  digest: sha256:124be14bfc1ce0275126269946d9a2f87abceca7d17151d3cb9232818d0338f9

hpa:
  minReplicas: 1
  maxReplicas: 2

env:
  STAGE: dev

secrets:
  AI_DB_URL: ai/AI_DB_URL
  AI_QDRANT_API_KEY: ai/AI_QDRANT_API_KEY
  AI_QDRANT_URL: ai/AI_QDRANT_URL
  Admin_Discord_ID: ai/Admin_Discord_ID
  Admin_Telegram_ID: ai/Admin_Telegram_ID
  DISCORD_BOT_TOKEN: ai/DISCORD_BOT_TOKEN
  DISCORD_CHANNEL_ID: ai/DISCORD_CHANNEL_ID
  KAFKA_BOOTSTRAP_SERVERS: broker/KAFKA_BOOTSTRAP_SERVERS
  TELEGRAM_BOT_TOKEN: ai/TELEGRAM_BOT_TOKEN
