# dev EKS 이미지는 CI가 dev-<sha> digest로 갱신한다.
stage: dev

# dev 파드는 non-prod 공용 노드(stage=stg)에 올리고 2개 AZ에 분산한다.
nodeStage: stg
zoneSpread: true

image:
  digest: sha256:e1f3f3320752c36ce1b396780119d3ee90ebbcd0d098fed9f772e80f312642f1

# dev Alloy 수집 경로가 아직 없다.
metrics:
  enabled: false

env:
  STAGE: dev

secrets:
  CONGESTION_AUTHOR_KEY_SECRET: backend/CONGESTION_AUTHOR_KEY_SECRET
  MONGODB_URI: backend/MONGODB_URI
  GOOGLE_APPLICATION_CREDENTIALS: backend/GOOGLE_APPLICATION_CREDENTIALS
