# V2 stg 태스크 정의와 같은 값이다. prod 태스크에는 없다.
stage: stg

# 2개 AZ에 노드가 있어 AZ 분산을 켠다.
zoneSpread: true

image:
  # rc-v2.1.0-3c53572. BE #336 이후 Kafka 포함 이미지다.
  digest: sha256:0a3085360edc6bd61aead3835ef9aff3c88af6c26e9dc375234167fd558a892b

# 앱이 OTLP로 직접 보내므로 Alloy 스크랩을 끈다.
