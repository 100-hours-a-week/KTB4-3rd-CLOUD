{{- range $stage := .Values.stages }}
{{- range $name := $.Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $stage }}
  labels:
    stage: {{ $stage }}
    app.kubernetes.io/part-of: moyeota-v3
# 앱은 Kubernetes API를 호출하지 않는다. Pod Identity 토큰은 별도 볼륨으로 주입된다.
automountServiceAccountToken: false
{{- end }}
{{- end }}
