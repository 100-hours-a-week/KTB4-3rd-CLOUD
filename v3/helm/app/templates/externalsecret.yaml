{{- if .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-secrets
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretRefreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-parameter-store
  target:
    name: {{ .Values.name }}-secrets
    creationPolicy: Owner
  data:
    {{- range $envName, $path := .Values.secrets }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: /moyeota/v2/{{ $.Values.stage }}/{{ $path }}
    {{- end }}
{{- end }}
