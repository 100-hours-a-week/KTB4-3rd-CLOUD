apiVersion: v1
kind: ConfigMap
metadata:
  name: congestion-logs
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                  5
        Log_Level              info
        Parsers_File           /fluent-bit/etc/congestion/parsers.conf
        storage.path           /var/lib/congestion-logs/buffer
        storage.max_chunks_up  16
        storage.backlog.mem_limit  16M
{{- range $stage := list "dev" "stg" }}
{{- range $service := list "fastapi" "worker" }}

    [INPUT]
        Name               tail
        Path               /var/log/pods/{{ $stage }}_{{ $service }}-*_*/{{ $service }}/*.log
        Tag                congestion.{{ $stage }}.{{ $service }}
        multiline.parser   cri
        DB                 /var/lib/congestion-logs/{{ $stage }}-{{ $service }}.db
        Read_from_Head     On
        Skip_Long_Lines    On
        storage.type       filesystem
{{- end }}

    [OUTPUT]
        Name                      cloudwatch_logs
        Match                     congestion.{{ $stage }}.*
        region                    {{ $.Values.region }}
        log_group_name            /moyeota/v3/{{ $stage }}/congestion-events
        log_stream_prefix         ${NODE_NAME}.
        auto_create_group         Off
        Retry_Limit               False
        storage.total_limit_size  128M
{{- end }}

    [FILTER]
        Name          parser
        Match         congestion.*
        Key_Name      log
        Parser        congestion_json
        Reserve_Data  Off

    [FILTER]
        Name          lua
        Match         congestion.*
        script        /fluent-bit/etc/congestion/sanitize.lua
        call          sanitize
        type_int_key  duration_ms

  parsers.conf: |
    [PARSER]
        Name    congestion_json
        Format  json

  sanitize.lua: |
{{ .Files.Get "files/sanitize.lua" | indent 4 }}
