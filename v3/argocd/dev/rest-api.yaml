# dev·develop 브랜치의 digest 커밋을 자동으로 동기화한다.
# values 순서는 deploy-app.sh와 같다. Application을 지워도 앱이 남도록 finalizer를 두지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-rest-api
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.github-status: ""
    notifications.argoproj.io/subscribe.on-failed.github-status: ""
spec:
  project: moyeota-dev
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-3rd-CLOUD.git
    targetRevision: main
    path: v3/helm/app
    helm:
      releaseName: rest-api
      valueFiles:
        - ../app-values/services/backend-common.yaml
        - ../app-values/services/rest-api.yaml
        - ../app-values/dev/backend-common.yaml
        - ../app-values/dev/rest-api.yaml
        - ../app-values/dev/kafka-client.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    # 삭제는 사람이 확인한다. 전환 스크립트의 수동 변경을 되돌리지 않도록 selfHeal을 끈다.
    automated:
      prune: false
      selfHeal: false
