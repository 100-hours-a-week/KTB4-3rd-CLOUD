# =============================================================================
# 이관 리허설 사이드카 — V1 Prod 호스트에 별도 Compose 프로젝트(moyeota-migration)로 띄운다
#   mig render가 /opt/moyeota-migration/compose.yaml 로 두고 같은 디렉터리의 .env 로 변수를 채운다
#
#   V1 Compose 프로젝트(moyeota)의 mysql·backend·frontend·nginx는 선언하지 않는다 (재생성·orphan 정리 대상이 되지 않게)
#   V1 네트워크(moyeota-app-prod, moyeota-db-prod internal)는 external로 참조만 한다
#   edge : 이 프로젝트 소유 bridge. internal 네트워크만으로는 포트 게시가 안 되므로 relay가 여기로 게시한다.
#          역방향 복제(S6) 때 V1 MySQL 컨테이너를 재시작 없이 여기에 붙여 stg RDS로 나가게 한다
# =============================================================================
name: moyeota-migration

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true

services:
  # 쓰기 지점 전환. 설정 파일은 datadir(proxysql-data)가 비어 있을 때만 읽는다 → 런타임 변경은 반드시 SAVE ... TO DISK
  proxysql:
    image: ${PROXYSQL_IMAGE:?}
    container_name: moyeota-proxysql
    restart: unless-stopped
    entrypoint: ["proxysql", "-f", "-c", "/etc/proxysql.cnf", "-D", "/var/lib/proxysql"]
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ./proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
      - proxysql-data:/var/lib/proxysql
    ports:
      - "127.0.0.1:6032:6032"
      - "${HOST_PRIVATE_IP:?}:6070:6070"
    networks:
      - app
      - database
    <<: *default-hardening
    logging: *default-logging

  # 정방향 복제(stg RDS → V1 binlog)와 Grafana V1 조회용 TCP 중계. V1 MySQL 컨테이너는 재생성하지 않는다
  relay:
    image: ${SOCAT_IMAGE:?}
    container_name: moyeota-relay
    restart: unless-stopped
    command: ["-d", "TCP-LISTEN:3306,fork,reuseaddr,keepalive", "TCP:${V1_MYSQL_HOST:?}:3306,keepalive"]
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "${HOST_PRIVATE_IP:?}:${RELAY_PORT:?}:3306"
    networks:
      - database
      - edge
    <<: *default-hardening
    logging: *default-logging

  # 보류 구간(S3~S5)에 SQL을 빠르게 호출하기 위한 상주 클라이언트 (호스트 네트워크: 127.0.0.1:6032, stg RDS)
  migcli:
    image: ${MYSQL_IMAGE:?}
    container_name: moyeota-migcli
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    network_mode: host
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    <<: *default-hardening
    logging: *default-logging

networks:
  app:
    name: ${V1_APP_NETWORK:?}
    external: true
  database:
    name: ${V1_DB_NETWORK:?}
    external: true
  edge:
    name: moyeota-migration-edge

volumes:
  proxysql-data:
    name: moyeota-migration-proxysql
