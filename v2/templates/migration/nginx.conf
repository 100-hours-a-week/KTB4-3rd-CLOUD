# =============================================================================
# 이관 리허설 v1-sim nginx — API 전용 (frontend 없음)
#   Non-Prod ALB(v1sim 호스트 규칙) → :80 → backend:8080
#   V1 nginx.conf(deploy/nginx/nginx.conf)와 다른 점
#     - limit_req : V1은 IP당 20r/s(burst 40). 여기서는 ALB 노드 IP가 출발지라 k6 부하(HTTP 약 45 RPS)가 429로 섞인다
#                   → 유실 판정이 흐려지지 않게 200r/s로 올린다 (이관 경로와 무관한 차이)
#     - /api/wss  : STOMP WebSocket 업그레이드 헤더를 넘긴다
# =============================================================================
user nginx;
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    keepalive_timeout 65s;
    client_max_body_size 10m;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_x_forwarded_for" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend_upstream {
        zone backend_upstream 64k;
        server backend:8080 resolve;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    server {
        listen 80 default_server;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/wss {
            proxy_pass http://backend_upstream;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api_limit burst=400 nodelay;
            proxy_pass http://backend_upstream;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            return 404;
        }
    }
}
